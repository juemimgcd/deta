[project]
name = "deta"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "httpx==0.28.1",
    "langchain-core==1.6.6",
    "langchain-openai==1.6.6",
    "openai>=3.17.0",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-sdk>=1.44.0",
    "pydantic>=2.13.5",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.8",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[project.scripts]
deta = "deta.cli:main"

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src/deta"]
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases = true
